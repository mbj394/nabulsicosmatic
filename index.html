<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مستودع النابلسي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--d:1;--bg:#f3f7f8;--card:#fff;--ink:#0c2230;--mut:#5b7180;--pri:#0b7f75;--mint:#5eead4;--acc:#ff6b4a;--line:#dde7ea;--hd:rgba(243,247,248,.82);--sh:0 18px 40px rgba(12,34,48,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[dir=rtl]{--d:-1}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07141c;--card:#0e2230;--ink:#e7f1f5;--mut:#93aebb;--pri:#5eead4;--line:#1b3646;--hd:rgba(7,20,28,.82);--sh:0 18px 40px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#07141c;--card:#0e2230;--ink:#e7f1f5;--mut:#93aebb;--pri:#5eead4;--line:#1b3646;--hd:rgba(7,20,28,.82);--sh:0 18px 40px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);backdrop-filter:blur(12px);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hd);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:auto;padding:0 18px}
.nav{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;margin-inline-end:auto}
.logo i{width:38px;height:38px;border-radius:10px;background:var(--pri);color:var(--bg);display:grid;place-items:center;font:700 26px/1 Arial,sans-serif}
nav{display:flex;gap:20px;color:var(--mut);margin-inline-end:10px}nav a{color:inherit;text-decoration:none}nav a:hover{color:var(--pri)}
.ib{position:relative;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;color:var(--ink)}
.cartb b{position:absolute;top:-7px;inset-inline-end:-7px;background:var(--acc);color:#fff;font-size:12px;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center}
.bump{animation:bump .5s}
.btn{border:0;cursor:pointer;font:inherit;font-weight:700;color:var(--bg);background:var(--pri);padding:12px 24px;border-radius:10px;text-decoration:none;display:inline-block;text-align:center;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-3px);box-shadow:var(--sh)}.btn:active{transform:scale(.97)}.full{width:100%;margin-top:12px}
.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.pw{position:relative}
.pop{position:absolute;top:50px;inset-inline-end:0;width:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--sh);display:none}.pop.show{display:block;animation:pop .25s}
.sg{display:flex;gap:6px;margin:6px 0 12px}.sg button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px;cursor:pointer;font:inherit}.sg .on{background:var(--pri);color:var(--bg);border-color:var(--pri)}
.hero{background:#0b3a2c;color:#fff;padding:56px 0;background-image:radial-gradient(circle,rgba(255,255,255,.09) 9px,transparent 10px);background-size:36px 36px}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero h1{font-size:clamp(28px,5vw,48px);line-height:1.35;font-weight:700}
.hero p{color:#bfe3d3;font-size:18px;max-width:500px;margin:14px 0 26px}
.bt{display:flex;gap:12px;flex-wrap:wrap}.hero .btn{background:var(--mint);color:#06281d}.hero .ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.orb{position:relative;max-width:360px;width:100%;justify-self:center;aspect-ratio:1}
.orb::before{content:"";position:absolute;inset:4%;background:var(--mint);opacity:.14;border-radius:42% 58% 55% 45%/50% 45% 55% 50%;animation:spin 16s linear infinite}
.hs{position:relative;width:100%;height:100%;overflow:visible}
.bxg{animation:float 4s ease-in-out infinite}.lid{transform-origin:78px 104px;animation:lid 4s ease-in-out infinite}
.pp{fill:#fff;animation:rise 4s ease-in infinite}.pp:nth-of-type(2){animation-delay:-1.3s;fill:#ff5a3c}.pp:nth-of-type(3){animation-delay:-2.6s}
.ecg{fill:none;stroke:#3ddc97;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.ecg.b{opacity:.22}.ecg.m{stroke-dasharray:28 100;animation:ecg 2.6s linear infinite;filter:drop-shadow(0 0 6px #3ddc97)}
section{padding:44px 0}
h2{font-size:28px;font-weight:700}.sub{color:var(--mut);margin:4px 0 22px}
.why{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line)}
.why div{padding:26px 20px;border-inline-start:1px solid var(--line)}.why div:first-child{border:0}
.why b{font-size:34px;display:block;line-height:1.3}.why h3{font-size:19px}.why span{color:var(--mut)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin-top:10px;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 20%,transparent)}.bad{border-color:#e5484d}
.srch{max-width:460px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px;margin-top:18px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;opacity:0;transform:translateY(30px);transition:opacity .7s,transform .7s,box-shadow .3s}
.pc.in{opacity:1;transform:none}.pc:hover{box-shadow:var(--sh)}
.pimg{position:relative;padding:24px;display:grid;place-items:center;perspective:600px;background:#0b3a2c radial-gradient(circle,rgba(255,255,255,.1) 7px,transparent 8px) 0 0/28px 28px}
.pimg img{width:60%;transition:transform .15s}
.ok{position:absolute;top:14px;inset-inline-start:14px;background:var(--mint);color:#06281d;font-size:13px;font-weight:700;padding:1px 12px;border-radius:99px}
.pi{padding:18px}.pi h3{font-size:20px}.pi p{color:var(--mut);font-size:15px}
.ch{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.ch span{border:1px solid var(--line);border-radius:99px;padding:0 12px;font-size:13px;color:var(--pri);font-weight:500}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.pr small,.bn{color:var(--mut);display:block;font-size:12px}.pr strong{font-size:20px;color:var(--pri)}
.bn{text-align:center;margin-top:8px;color:var(--acc);font-weight:500}
.st{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.st button{width:32px;height:32px;border:0;border-radius:8px;background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;transition:transform .15s}.st button:active{transform:scale(.8)}
.st output{min-width:30px;text-align:center;font-weight:700}
.req{background:var(--card);border:1px dashed var(--pri);border-radius:20px;padding:26px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.req>div:first-child{flex:1 1 260px}.rq{flex:1 1 320px;display:flex;gap:10px;align-items:center}.rq input{margin:0}.rq .btn{white-space:nowrap}
.em{text-align:center;color:var(--mut);padding:18px}
footer{text-align:center;color:var(--mut);padding:28px 18px 90px;border-top:1px solid var(--line)}
.ov{position:fixed;inset:0;background:rgba(4,18,12,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}.ov.show{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--bg);z-index:50;display:flex;flex-direction:column;transform:translateX(calc(var(--d)*102%));transition:transform .4s cubic-bezier(.2,.9,.3,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.dr.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.db{flex:1;overflow:auto;padding:16px 18px}.db h4{margin-top:18px}
.it{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;animation:pop .35s}
.it img{width:62px;border-radius:8px;background:#0b3a2c;padding:4px}.it>div{flex:1}.it small{display:block;color:var(--mut)}.st.sm{display:inline-flex;margin-top:4px}.x{border:0;background:none;cursor:pointer;font-size:18px}
.df{padding:14px 18px;border-top:1px solid var(--line);background:var(--card)}#sum>div{display:flex;justify-content:space-between}.tot{font-weight:700;font-size:18px;color:var(--pri)}
.mo{position:fixed;inset:0;background:rgba(4,18,12,.6);display:grid;place-items:center;padding:18px;z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}.mo.show{opacity:1;pointer-events:auto}
.mo>div{background:var(--card);border-radius:22px;padding:28px;max-width:380px;width:100%;text-align:center;transform:scale(.85);transition:transform .4s cubic-bezier(.2,1.4,.4,1)}.mo.show>div{transform:none}
.mo .btn{margin-top:10px;width:100%}.mo .em{font-size:14px;padding:6px 0}.mo h2{font-size:24px}
.fabs{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;display:flex;flex-direction:column;gap:10px;z-index:25;align-items:flex-start}
.fb{border:0;cursor:pointer;font:inherit;font-weight:700;padding:11px 18px;border-radius:99px;color:#fff;text-decoration:none;box-shadow:var(--sh);animation:ring 2.8s infinite}
.fb.s{background:#1fa855}.fb.a{background:var(--pri);color:var(--bg)}
.up{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-end:16px;width:46px;height:46px;border-radius:50%;z-index:25;opacity:0;pointer-events:none;transform:translateY(20px);transition:.3s;background:var(--pri);color:var(--bg);border:0;font-size:20px;cursor:pointer;box-shadow:var(--sh)}.up.show{opacity:1;pointer-events:auto;transform:none}
.ai{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 32px));height:min(540px,72vh);background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);z-index:45;display:none;flex-direction:column;overflow:hidden}.ai.show{display:flex;animation:pop .3s}
.ml{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bb2{max-width:88%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;font-size:15px}.me{align-self:flex-end;background:var(--pri);color:var(--bg)}.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.nt{padding:0 12px 6px;color:var(--mut);font-size:12px}.ir{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.ir input{margin:0}.ir .btn{padding:8px 16px}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 30px;background:var(--ink);color:var(--bg);padding:10px 22px;border-radius:99px;opacity:0;transition:.35s;z-index:80;pointer-events:none}#toast.show{opacity:1;translate:-50% 0}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(0,-70px);opacity:0}}
@keyframes float{50%{translate:0 -10px}}@keyframes spin{to{rotate:360deg}}@keyframes lid{50%{transform:rotate(-14deg)}}
@keyframes ecg{from{stroke-dashoffset:28}to{stroke-dashoffset:-100}}
@keyframes bump{40%{transform:scale(1.4)}}@keyframes pop{from{opacity:0;transform:scale(.9)}}
@keyframes ring{50%{box-shadow:0 0 0 9px rgba(61,220,151,.22)}}
@media(max-width:760px){.hg{grid-template-columns:1fr}nav{display:none}.orb{max-width:270px}.why{grid-template-columns:1fr}.why div{border:0;border-top:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pc{opacity:1;transform:none}}
.btn{background-image:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 60%,#2563eb))}
.ghost,.hero .ghost{background-image:none}
.hero .btn:not(.ghost){background-image:linear-gradient(135deg,#5eead4,#7dd3fc)}
.red{background-image:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.hero{background-color:#0a1f2c;background-image:radial-gradient(520px 320px at 88% 8%,rgba(94,234,212,.22),transparent),radial-gradient(480px 300px at 4% 100%,rgba(37,99,235,.28),transparent),radial-gradient(circle,rgba(255,255,255,.07) 9px,transparent 10px);background-size:auto,auto,36px 36px}
.hero p{color:#b4d3da}
.logo i{background:linear-gradient(135deg,#0e8f83,#2563eb);color:#fff;border-radius:12px}
.pc{border-radius:24px}.pimg{background:#0a1f2c radial-gradient(circle,rgba(255,255,255,.08) 7px,transparent 8px) 0 0/28px 28px}.it img{background:#0a1f2c}
.why b{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--pri) 14%,transparent);font-size:26px;margin-bottom:8px}
.req{border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 10%,var(--card)),var(--card))}
.bxg>rect:first-of-type{fill:#14b8a6}.lid{fill:#0f766e}.ecg{stroke:#5eead4}.ecg.m{filter:drop-shadow(0 0 6px #5eead4)}
.fb.a{background:linear-gradient(135deg,#2563eb,#38bdf8);color:#fff}
.ai .dh{background:linear-gradient(135deg,#2563eb,#38bdf8);color:#fff;border:0}.ai .dh .ib{background:rgba(255,255,255,.2);color:#fff;border:0}
.me{background:#2563eb;color:#fff}.ir .btn{background:#2563eb;color:#fff}
.ok.no{background:#e5484d;color:#fff}.of{position:absolute;top:14px;inset-inline-end:14px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;padding:1px 12px;border-radius:99px}
.pc.out .pimg img{filter:grayscale(1);opacity:.55}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.adm{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 40px;display:none}.adm.show{display:block}.adm .in{max-width:900px;margin:auto}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1}
select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin-top:10px}
.al{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px;flex-wrap:wrap}.al img{width:48px;height:48px;object-fit:contain;background:#0a1f2c;border-radius:8px}.al>div{flex:1;min-width:140px}.al small{display:block;color:var(--mut)}
.od{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.od pre{white-space:pre-wrap;font:inherit;color:var(--mut);margin:6px 0}
.tg{display:inline-block;border-radius:99px;padding:0 12px;font-size:13px;font-weight:700;background:var(--acc);color:#fff}.tg.d{background:#1fa855}
.sm2{padding:6px 14px;font-size:14px;margin:4px 6px 0 0}
.af{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 14px 14px}.ck{display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer}.ck input{width:20px;height:20px;margin:0;padding:0}
details{margin-top:6px}summary{cursor:pointer;color:var(--pri);font-weight:700;padding:8px 0}#a_pv{max-height:90px;margin-top:10px;border-radius:10px;background:#0a1f2c}
button.tg{border:0;font:inherit;font-weight:700;cursor:pointer}.adl{font-size:12px;color:var(--mut);opacity:.6;text-decoration:none}

.cb{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.cb button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 16px;font:inherit;cursor:pointer}.cb .on{background:var(--pri);color:var(--bg);border-color:var(--pri)}
.nti{margin:6px 0 0;padding:7px 10px;font-size:14px}.nb{border:0;background:none;color:var(--pri);cursor:pointer;font:inherit;font-size:13px;padding:2px 0}
.tabs{flex-wrap:wrap}.tabs button{padding:10px 8px;font-size:14px;min-width:72px}.tabs .on{background:var(--pri);color:var(--bg)}.pane{margin-top:6px}
.dbs{border-radius:12px;padding:10px 14px;margin-top:12px;font-size:14px}.dbs.ok2{background:color-mix(in srgb,#1fa855 16%,var(--card))}.dbs.warn{background:color-mix(in srgb,#e5484d 14%,var(--card))}
.oc{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,var(--card)),var(--card));border:1px solid var(--line);border-radius:22px;padding:22px}
.oc .oi{font-size:30px}.oc h3{font-size:20px;margin:4px 0}.oc p{color:var(--mut);white-space:pre-wrap}
.sg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 10px}.hint{font-size:13px;color:var(--mut);margin-top:6px}
/* ===== الدخولية الجديدة: نبض القلب ===== */
#sp{position:fixed;inset:0;z-index:100;transition:opacity .6s;display:grid;place-items:center;overflow:hidden;background:radial-gradient(700px 420px at 50% 40%,#0f3a45,#06141c 70%)}
.sx{display:grid;justify-items:center;gap:10px;text-align:center;margin-top:-6vh;padding:0 16px}
.sc{width:min(46vw,190px);overflow:visible;animation:pu 2.4s 1.8s ease-in-out infinite}
.rg,.ec,.cr{stroke-dasharray:100;stroke-dashoffset:100;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rg{stroke:#5eead4;stroke-width:3;opacity:.7;animation:dr 1.3s ease forwards}
.ec{stroke:#7dd3fc;stroke-width:3.5;filter:drop-shadow(0 0 6px #7dd3fc);animation:dr 1.4s .3s ease forwards,gone .6s 2.2s forwards}
.cr{stroke:#5eead4;stroke-width:3;fill:#5eead4;fill-opacity:0;animation:dr 1.1s .5s ease forwards,fl .7s 1.5s forwards}
.sn{font:700 clamp(42px,12vw,84px)/1.3 "Aref Ruqaa","IBM Plex Sans Arabic",serif;color:#e8fffb;text-shadow:0 0 28px rgba(94,234,212,.45);animation:nm 1.2s 1.3s cubic-bezier(.2,.8,.2,1) both}
.stl{color:#8fb9c0;font-size:clamp(14px,3.6vw,18px);animation:nm 1s 2s both}
#en{position:absolute;bottom:9%;left:50%;translate:-50% 0;z-index:3;background:var(--mint);color:#06281d;opacity:0;pointer-events:none;transition:opacity .6s}
#en.show{opacity:1;pointer-events:auto;animation:ring 2.4s infinite}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes fl{to{fill-opacity:1}}
@keyframes gone{to{opacity:0}}
@keyframes nm{from{opacity:0;filter:blur(14px);transform:translateY(18px) scale(.92)}}
@keyframes pu{50%{filter:drop-shadow(0 0 20px rgba(94,234,212,.65))}}
@media(prefers-reduced-motion:reduce){.rg,.cr{stroke-dashoffset:0}.cr{fill-opacity:1}.ec{opacity:0}}
</style>
</head>
<body>
<div id="sp"><div class="sx">
<svg class="sc" viewBox="0 0 200 200" aria-hidden="true">
<circle class="rg" cx="100" cy="100" r="90" pathLength="100"/>
<path class="ec" pathLength="100" d="M-140 100H30L45 100L55 70L70 130L88 40L104 150L116 100H340"/>
<path class="cr" pathLength="100" d="M80 45h40v35h35v40h-35v35H80v-35H45V80h35z"/>
</svg>
<div class="sn" data-t="brand"></div>
<div class="stl" data-t="tag"></div>
</div><button class="btn" id="en" data-t="enter"></button></div>

<header><div class="wrap nav">
<div class="logo"><i>+</i><span data-t="brand"></span></div>
<nav><a href="#why" data-t="nw"></a><a href="#offers" id="nvo" data-t="no" hidden></a><a href="#products" data-t="np"></a></nav>
<div class="pw"><button class="ib" id="stb" aria-label="Settings">⚙</button>
<div class="pop" id="pop"><b data-t="th"></b><div class="sg"><button data-th="light" data-t="lt"></button><button data-th="dark" data-t="dk"></button></div><b data-t="lg"></b><div class="sg"><button data-lg="ar">العربية</button><button data-lg="en">English</button></div></div></div>
<button class="ib cartb" id="cb" aria-label="Cart">🛒<b id="bd">0</b></button>
</div></header>

<section class="hero"><div class="wrap hg">
<div><h1 data-t="h1"></h1><p data-t="hp"></p>

function catAdm(){A('cat_ls').innerHTML=CATS.map(c=>`<div class="al"><div><b>${esc(c.name)}</b></div><button class="btn ghost sm2" data-ce="${esc(c.id)}">تعديل</button><button class="btn ghost sm2" data-cx="${esc(c.id)}">حذف</button></div>`).join('')||'<p class="em">لا توجد فئات بعد.</p>'}
function catSel(){const s=A('a_ct'),v=s.value;s.innerHTML='<option value="">بدون فئة</option>'+CATS.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');s.value=v}
async function saveCats(c){try{if(db)await db.doc('settings/main').set({cats:c},{merge:true});else ls.set('jm_set',{...ls.get('jm_set',{}),cats:c});applySet({cats:c});return true}catch(e){toast(db?'تعذّر الحفظ — سجّل دخول الإدارة أولاً':'تعذّر الحفظ');return false}}
function fillS(){A('s_wa').value=WA;A('s_bk').value=CFG.bulk;A('s_pc').value=Math.round(CFG.off*1000)/10}
async function putO(id,v){if(db){await db.doc('offers/'+id).set(v);return}const n={...v,id};OF=OF.some(o=>o.id===id)?OF.map(o=>o.id===id?n:o):[...OF,n];ls.set('jm_offers',OF);ofr();admF()}
async function delO(id){if(db){await db.doc('offers/'+id).delete();return}OF=OF.filter(o=>o.id!==id);ls.set('jm_offers',OF);ofr();admF()}
function admF(){A('o_list').innerHTML=OF.map(o=>`<div class="al"><div><b>${esc(o.title)}</b><small>${esc(o.desc||'')}</small></div><button class="tg${o.on===false?'':' d'}" data-ot="${esc(o.id)}">${o.on===false?'متوقف':'فعّال'}</button><button class="btn ghost sm2" data-oe="${esc(o.id)}">تعديل</button><button class="btn ghost sm2" data-ox="${esc(o.id)}">حذف</button></div>`).join('')||'<p class="em">لا توجد عروض بعد.</p>'}
function ofclr(){['o_id','o_ti','o_ds'].forEach(i=>A(i).value='');A('o_on').checked=true;A('o_fm').hidden=true}
async function transO(v){const ar=/[\u0600-\u06FF]/.test(v.title),sm=await getSm();if(!sm)return null;
try{const r=await sm([{role:'user',content:'Translate these pharmacy offer fields to '+(ar?'English':'Arabic')+'. Reply with ONLY JSON: {"title":"","desc":""}\n'+JSON.stringify({title:v.title,desc:v.desc})}],{cache:false});
const j=JSON.parse(r.text.replace(/```json|```/g,'').trim());return{tl:ar?'en':'ar',t:{title:String(j.title||''),desc:String(j.desc||'')}}}catch(e){return null}}
A('s_sv').onclick=async()=>{const w=pn(A('s_wa').value);if(!/^\d{9,15}$/.test(w))return toast('رقم واتساب غير صحيح');
const v={...SET,wa:w,bulk:Math.max(1,Math.round(+A('s_bk').value)||CFG.bulk),pct:Math.min(90,Math.max(0,+A('s_pc').value||0))};
try{if(db)await db.doc('settings/main').set(v,{merge:true});else ls.set('jm_set',v);applySet(v);fillS();toast('تم حفظ الإعدادات')}catch(e){toast(db?'تعذّر الحفظ — سجّل دخول الإدارة أولاً':'تعذّر الحفظ')}};
A('o_new').onclick=()=>{ofclr();A('o_fm').hidden=false;A('o_ti').focus()};A('o_cl').onclick=ofclr;
A('o_sv').onclick=async()=>{const ti=A('o_ti').value.trim();if(!ti)return toast('اكتب عنوان العرض');
const id=A('o_id').value||'o'+Date.now().toString(36),old=OF.find(x=>x.id===id)||{},v={title:ti,desc:A('o_ds').value.trim(),on:A('o_on').checked};
if(old.t&&old.title===v.title&&(old.desc||'')===v.desc){v.t=old.t;v.tl=old.tl}else{A('o_sv').disabled=true;const tt=await transO(v);A('o_sv').disabled=false;if(tt){v.t=tt.t;v.tl=tt.tl}}
try{await putO(id,v);toast(v.t?'تم حفظ العرض مع الترجمة التلقائية':'تم حفظ العرض');ofclr()}catch(e){toast(db?'تعذّر الحفظ — سجّل دخول الإدارة أولاً':'تعذّر الحفظ')}};
const addCat=async()=>{const n=A('c_nm').value.trim();if(!n)return toast('اكتب اسم الفئة');if(await saveCats([...CATS,{id:'c'+Date.now().toString(36),name:n}])){A('c_nm').value='';toast('تمت إضافة الفئة')}};
A('c_add').onclick=addCat;A('c_nm').onkeydown=e=>{if(e.key==='Enter')addCat()};
function splash3(){
  const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  setTimeout(()=>A('en').classList.add('show'),rm?0:2600);
}
applyL();splash3();dbInit();
</script>
</body>
